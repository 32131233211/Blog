<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F7F6F4; }
      .card-bg { fill: #FFFFFF; stroke: #C7C7C7; stroke-width: 2; rx: 16; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-size: 22px; font-weight: 700; fill: #282828; }
    </style>
  </defs>

  <rect width="800" height="600" class="bg" />
  <rect x="40" y="30" width="720" height="540" class="card-bg" />

  <!-- Header Bar -->
  <path d="M 40 46 Q 40 30 56 30 L 744 30 Q 760 30 760 46 L 760 90 L 40 90 Z" fill="#EA5F39" />
  <circle cx="75" cy="60" r="14" fill="#FFFFFF" opacity="0.2" />
  <text x="75" y="66" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#FFFFFF">🔗</text>
  <text x="105" y="67" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Verificación de Enlaces Web · Identificación de Sitios Seguros</text>

  <!-- Browser Window Simulation -->
  <g transform="translate(60, 115)">
    <rect x="0" y="0" width="680" height="425" rx="10" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1.5" />
    
    <!-- Browser Top Bar -->
    <rect x="0" y="0" width="680" height="46" rx="10" fill="#F7F6F4" />
    <circle cx="25" cy="23" r="6" fill="#EA5F39" />
    <circle cx="45" cy="23" r="6" fill="#E79410" />
    <circle cx="65" cy="23" r="6" fill="#0A9685" />

    <!-- Comparison of Address Bars -->
    <g transform="translate(30, 65)">
      <!-- Secure URL -->
      <rect x="0" y="0" width="620" height="75" rx="8" fill="#F0F9F8" stroke="#0A9685" stroke-width="2" />
      <rect x="15" y="15" width="45" height="45" rx="8" fill="#0A9685" />
      <text x="37" y="44" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" fill="#FFFFFF">🔒</text>
      
      <text x="75" y="32" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#076C60">https://www.minsalud.gov.co/citas</text>
      <text x="75" y="52" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0A9685">✔ SITIO SEGURO Y OFICIAL</text>
      <text x="270" y="52" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">· Candado visible + "https" + termina en ".gov.co"</text>
    </g>

    <g transform="translate(30, 155)">
      <!-- Unsafe / Fake URL -->
      <rect x="0" y="0" width="620" height="75" rx="8" fill="#FEF5F3" stroke="#EA5F39" stroke-width="2" />
      <rect x="15" y="15" width="45" height="45" rx="8" fill="#EA5F39" />
      <text x="37" y="44" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" fill="#FFFFFF">⚠️</text>
      
      <text x="75" y="32" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#EA5F39">http://salud-citas-colombia.xyz/login</text>
      <text x="75" y="52" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#EA5F39">❌ SITIO FALSO / INSEGURO</text>
      <text x="260" y="52" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">· Sin candado + "http" sin 's' + dominio desconocido ".xyz"</text>
    </g>

    <!-- Key lessons from Yeimi -->
    <g transform="translate(30, 255)">
      <rect x="0" y="0" width="620" height="145" rx="8" fill="#F7F6F4" stroke="#C7C7C7" stroke-width="1" />
      <text x="20" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#EA5F39">Pautas enseñadas por Yeimi para revisar antes de abrir un link:</text>
      
      <g transform="translate(20, 42)">
        <text x="0" y="20" font-family="'Inter', sans-serif" font-size="13" fill="#282828"><tspan font-weight="700" fill="#0A9685">1. Mire el principio:</tspan> Debe decir siempre <tspan font-weight="700">"https://"</tspan> con la 's' de seguridad.</text>
        <text x="0" y="45" font-family="'Inter', sans-serif" font-size="13" fill="#282828"><tspan font-weight="700" fill="#0A9685">2. Busque el candado cerrado:</tspan> Debe estar al lado izquierdo de la dirección web.</text>
        <text x="0" y="70" font-family="'Inter', sans-serif" font-size="13" fill="#282828"><tspan font-weight="700" fill="#0A9685">3. Revise la ortografía:</tspan> Los estafadores cambian letras (ej: "g0ogle" en vez de "google").</text>
        <text x="0" y="93" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#5F5E5A">Consejo: Si tiene dudas, no haga clic; escriba el nombre directamente en el buscador.</text>
      </g>
    </g>
  </g>
</svg>
