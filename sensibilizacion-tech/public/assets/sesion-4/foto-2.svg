<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F7F6F4; }
      .card-bg { fill: #FFFFFF; stroke: #C7C7C7; stroke-width: 2; rx: 16; }
    </style>
  </defs>

  <rect width="800" height="600" class="bg" />
  <rect x="40" y="30" width="720" height="540" class="card-bg" />

  <!-- Header Bar -->
  <path d="M 40 46 Q 40 30 56 30 L 744 30 Q 760 30 760 46 L 760 90 L 40 90 Z" fill="#EA5F39" />
  <circle cx="75" cy="60" r="14" fill="#FFFFFF" opacity="0.2" />
  <text x="75" y="66" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#FFFFFF">🔍</text>
  <text x="105" y="67" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Navegación en Buscadores · Búsqueda Segura y Resultados Oficiales</text>

  <!-- Google Search Screen Mockup -->
  <g transform="translate(60, 115)">
    <rect x="0" y="0" width="680" height="425" rx="10" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1.5" />
    
    <!-- Search Bar -->
    <g transform="translate(30, 25)">
      <rect x="0" y="0" width="620" height="48" rx="24" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1.5" />
      <text x="25" y="30" font-family="'Inter', sans-serif" font-size="16">🔍</text>
      <text x="60" y="30" font-family="'Inter', sans-serif" font-size="15" fill="#282828">consultar cita medica eps sura medellin</text>
      <text x="560" y="30" font-family="'Inter', sans-serif" font-size="16">🎤</text>
    </g>

    <!-- Search Results Comparison -->
    <g transform="translate(30, 95)">
      <!-- Ad / Sponsored Result (Warning) -->
      <rect x="0" y="0" width="620" height="110" rx="8" fill="#FEF5F3" stroke="#EA5F39" stroke-width="1" />
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="70" height="20" rx="4" fill="#EA5F39" />
        <text x="35" y="14" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">PATROCINADO</text>
        <text x="85" y="15" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">https://gestiones-rapidas-salud.net</text>
        <text x="0" y="42" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#A84429">Citas Médicas al Instante — Trámites y Pagos</text>
        <text x="0" y="65" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">⚠️ Explicación: Cuidado con los anuncios patrocinados arriba. No siempre son la entidad oficial.</text>
      </g>

      <!-- Organic / Official Result (Recommended) -->
      <rect x="0" y="125" width="620" height="110" rx="8" fill="#F0F9F8" stroke="#0A9685" stroke-width="1.5" />
      <g transform="translate(20, 145)">
        <rect x="0" y="0" width="60" height="20" rx="4" fill="#0A9685" />
        <text x="30" y="14" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">OFICIAL</text>
        <text x="75" y="15" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#076C60">https://www.epssura.com/citas</text>
        <text x="0" y="42" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#076C60">Portal Oficial EPS SURA: Asignación de Citas Médicas</text>
        <text x="0" y="65" font-family="'Inter', sans-serif" font-size="12" fill="#282828">✔ Explicación: Este es el enlace correcto y seguro. Pertenece al dominio legítimo de la EPS.</text>
      </g>

      <!-- Summary advice -->
      <rect x="0" y="250" width="620" height="60" rx="8" fill="#F7F6F4" />
      <text x="20" y="25" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#EA5F39">Buenas prácticas aprendidas:</text>
      <text x="20" y="45" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">• Escribir frases completas en el buscador · • Pasar de largo los anuncios dudosos · • Entrar solo al portal legítimo</text>
    </g>
  </g>
</svg>
