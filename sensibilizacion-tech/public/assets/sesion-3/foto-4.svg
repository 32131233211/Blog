<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F7F6F4; }
      .card-bg { fill: #FFFFFF; stroke: #C7C7C7; stroke-width: 2; rx: 16; }
      .phone-frame { fill: #FFFFFF; stroke: #076C60; stroke-width: 3; rx: 28; }
      .code-box { fill: #F0F9F8; stroke: #0A9685; stroke-width: 2; rx: 8; }
    </style>
  </defs>

  <rect width="800" height="600" class="bg" />
  <rect x="40" y="30" width="720" height="540" class="card-bg" />

  <!-- Header Bar -->
  <path d="M 40 46 Q 40 30 56 30 L 744 30 Q 760 30 760 46 L 760 90 L 40 90 Z" fill="#0A9685" />
  <circle cx="75" cy="60" r="14" fill="#FFFFFF" opacity="0.2" />
  <text x="75" y="66" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#FFFFFF">🛡️</text>
  <text x="105" y="67" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Autenticación Multifactor (MFA) · Doble Capa de Protección</text>

  <!-- Left Side: Phone with Verification Screen -->
  <g transform="translate(80, 115)">
    <rect x="0" y="0" width="280" height="425" class="phone-frame" />
    <rect x="95" y="12" width="90" height="10" rx="5" fill="#C7C7C7" />

    <!-- App Interface -->
    <rect x="15" y="35" width="250" height="370" rx="8" fill="#FFFFFF" />
    
    <!-- Shield Icon in phone -->
    <circle cx="140" cy="85" r="28" fill="#F0F9F8" stroke="#0A9685" stroke-width="2" />
    <text x="140" y="93" text-anchor="middle" font-family="'Inter', sans-serif" font-size="24">🔐</text>

    <text x="140" y="135" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#282828">Verificación en 2 Pasos</text>
    <text x="140" y="155" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">Ingrese el código temporal enviado</text>
    <text x="140" y="170" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">a su celular terminado en **84</text>

    <!-- 6 Digits Boxes -->
    <g transform="translate(25, 195)">
      <rect x="0" y="0" width="32" height="42" class="code-box" />
      <text x="16" y="27" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#076C60">5</text>
      
      <rect x="38" y="0" width="32" height="42" class="code-box" />
      <text x="54" y="27" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#076C60">2</text>
      
      <rect x="76" y="0" width="32" height="42" class="code-box" />
      <text x="92" y="27" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#076C60">9</text>
      
      <rect x="122" y="0" width="32" height="42" class="code-box" />
      <text x="138" y="27" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#076C60">1</text>
      
      <rect x="160" y="0" width="32" height="42" class="code-box" />
      <text x="176" y="27" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#076C60">8</text>
      
      <rect x="198" y="0" width="32" height="42" class="code-box" />
      <text x="214" y="27" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#076C60">4</text>
    </g>

    <text x="140" y="260" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#EA5F39">⏱ El código vence en: 04:32 min</text>

    <!-- Confirm button -->
    <rect x="30" y="285" width="220" height="42" rx="6" fill="#0A9685" />
    <text x="140" y="311" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Confirmar y Entrar</text>

    <!-- Phone Home Bar -->
    <rect x="90" y="405" width="100" height="5" rx="2.5" fill="#C7C7C7" />
  </g>

  <!-- Right Side: Educational Diagram -->
  <g transform="translate(390, 115)">
    <text x="0" y="25" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#282828">¿Qué es el MFA y cómo protege?</text>
    <text x="0" y="50" font-family="'Inter', sans-serif" font-size="14" fill="#5F5E5A">Explicación paso a paso de Sebastián para los participantes</text>

    <!-- Step 1 -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="330" height="75" rx="8" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1.5" />
      <circle cx="35" cy="37" r="18" fill="#F0F9F8" stroke="#0A9685" stroke-width="2" />
      <text x="35" y="44" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0A9685">Paso 1</text>
      <text x="70" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#282828">Primer candado: Su contraseña</text>
      <text x="70" y="52" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">Lo que usted sabe (su clave secreta).</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="330" height="75" rx="8" fill="#FFFFFF" stroke="#0A9685" stroke-width="2" />
      <circle cx="35" cy="37" r="18" fill="#0A9685" />
      <text x="35" y="44" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Paso 2</text>
      <text x="70" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#076C60">Segundo candado: Código en celular</text>
      <text x="70" y="52" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">Un número que solo llega a sus manos.</text>
    </g>

    <!-- Protection Summary -->
    <g transform="translate(0, 255)">
      <rect x="0" y="0" width="330" height="150" rx="8" fill="#FEF5F3" stroke="#EA5F39" stroke-width="1" />
      <text x="18" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#EA5F39">🛡️ Beneficio inmediato para el hogar:</text>
      <text x="18" y="58" font-family="'Inter', sans-serif" font-size="12" fill="#282828">Aunque un delincuente logre adivinar su clave,</text>
      <text x="18" y="78" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#EA5F39">NO PODRÁ INGRESAR</text>
      <text x="18" y="98" font-family="'Inter', sans-serif" font-size="12" fill="#282828">porque el segundo código solo llega a su propio teléfono físico.</text>
      <text x="18" y="128" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#5F5E5A">✔ Aplicado en WhatsApp, Gmail y banca móvil.</text>
    </g>
  </g>
</svg>
