<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F7F6F4; }
      .card-bg { fill: #FFFFFF; stroke: #C7C7C7; stroke-width: 2; rx: 16; }
    </style>
  </defs>

  <rect width="800" height="600" class="bg" />
  <rect x="40" y="30" width="720" height="540" class="card-bg" />

  <!-- Header Bar -->
  <path d="M 40 46 Q 40 30 56 30 L 744 30 Q 760 30 760 46 L 760 90 L 40 90 Z" fill="#0A9685" />
  <circle cx="75" cy="60" r="14" fill="#FFFFFF" opacity="0.2" />
  <text x="75" y="66" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#FFFFFF">📝</text>
  <text x="105" y="67" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Evaluación y Cuestionario Final · Capacitación 3</text>

  <!-- Quiz Form Simulation Window -->
  <g transform="translate(70, 115)">
    <rect x="0" y="0" width="660" height="425" rx="10" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1.5" />
    
    <!-- Top toolbar -->
    <rect x="0" y="0" width="660" height="42" rx="10" fill="#F7F6F4" />
    <text x="25" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#0A9685">Microsoft Forms · Cuestionario: Evaluación de Pautas de Seguridad Digital</text>
    <text x="540" y="26" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">4 Participantes</text>

    <!-- Question 1 -->
    <g transform="translate(30, 60)">
      <text x="0" y="20" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#282828">1. Si le llega un mensaje de texto diciendo que ganó un premio millonario y debe abrir un link, ¿qué hace?</text>
      
      <!-- Option A -->
      <rect x="15" y="35" width="580" height="34" rx="6" fill="#FEF5F3" stroke="#EA5F39" stroke-width="1" />
      <circle cx="35" cy="52" r="8" fill="#FFFFFF" stroke="#EA5F39" stroke-width="2" />
      <text x="55" y="57" font-family="'Inter', sans-serif" font-size="13" fill="#282828">A) Toco el link rápido para no perder el premio.</text>

      <!-- Option B (Correct) -->
      <rect x="15" y="78" width="580" height="34" rx="6" fill="#F0F9F8" stroke="#0A9685" stroke-width="1.5" />
      <circle cx="35" cy="95" r="8" fill="#0A9685" />
      <text x="35" y="99" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#FFFFFF">✓</text>
      <text x="55" y="100" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#076C60">B) Lo ignoro, borro el mensaje y no abro ningún enlace (Respuesta Correcta - 100% de acierto).</text>
    </g>

    <!-- Question 2 -->
    <g transform="translate(30, 190)">
      <text x="0" y="20" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#282828">2. ¿Para qué sirve tener activo el segundo código (MFA) en su WhatsApp y correo?</text>
      
      <!-- Option A (Correct) -->
      <rect x="15" y="35" width="580" height="34" rx="6" fill="#F0F9F8" stroke="#0A9685" stroke-width="1.5" />
      <circle cx="35" cy="52" r="8" fill="#0A9685" />
      <text x="35" y="56" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#FFFFFF">✓</text>
      <text x="55" y="57" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#076C60">A) Para que nadie pueda clonar mi cuenta aunque intenten robar mi clave (100% de acierto).</text>

      <!-- Option B -->
      <rect x="15" y="78" width="580" height="34" rx="6" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1" />
      <circle cx="35" cy="95" r="8" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="2" />
      <text x="55" y="100" font-family="'Inter', sans-serif" font-size="13" fill="#5F5E5A">B) Para que el celular se descargue más rápido.</text>
    </g>

    <!-- Results Banner -->
    <g transform="translate(30, 325)">
      <rect x="0" y="0" width="600" height="80" rx="8" fill="#F7F6F4" stroke="#0A9685" stroke-width="1" />
      <text x="20" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0A9685">📊 Balance pedagógico de la evaluación:</text>
      <text x="20" y="50" font-family="'Inter', sans-serif" font-size="13" fill="#282828">Los participantes demostraron asimilación completa de las pautas de prevención de fraudes y reconocieron la importancia de nunca compartir códigos temporales.</text>
      <text x="20" y="68" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#5F5E5A">Acompañamiento presencial de Sebastián y Brando durante la resolución del cuestionario.</text>
    </g>
  </g>
</svg>
