<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F7F6F4; }
      .card-bg { fill: #FFFFFF; stroke: #C7C7C7; stroke-width: 2; rx: 16; }
      .phone-frame { fill: #FFFFFF; stroke: #C95231; stroke-width: 3; rx: 28; }
    </style>
  </defs>

  <rect width="800" height="600" class="bg" />
  <rect x="40" y="30" width="720" height="540" class="card-bg" />

  <!-- Header Bar -->
  <path d="M 40 46 Q 40 30 56 30 L 744 30 Q 760 30 760 46 L 760 90 L 40 90 Z" fill="#EA5F39" />
  <circle cx="75" cy="60" r="14" fill="#FFFFFF" opacity="0.2" />
  <text x="75" y="66" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#FFFFFF">📥</text>
  <text x="105" y="67" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Cómo Descargar un Documento · Identificación de Archivos PDF</text>

  <!-- Left Side: Phone UI with Download Flow -->
  <g transform="translate(80, 115)">
    <rect x="0" y="0" width="280" height="425" class="phone-frame" />
    <rect x="95" y="12" width="90" height="10" rx="5" fill="#C7C7C7" />

    <!-- Web Page Simulation inside Phone -->
    <rect x="15" y="35" width="250" height="370" rx="8" fill="#FFFFFF" />

    <!-- Website Header -->
    <rect x="15" y="35" width="250" height="45" rx="8" fill="#F0F9F8" />
    <text x="30" y="62" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0A9685">Servicios Públicos · Factura</text>

    <!-- Document Card -->
    <g transform="translate(30, 100)">
      <rect x="0" y="0" width="220" height="110" rx="8" fill="#F7F6F4" stroke="#C7C7C7" stroke-width="1" />
      <rect x="15" y="20" width="36" height="46" rx="4" fill="#EA5F39" />
      <text x="33" y="48" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">PDF</text>
      
      <text x="60" y="35" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#282828">Factura_Agua_Oct.pdf</text>
      <text x="60" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#5F5E5A">Tamaño: 245 KB</text>
      <text x="60" y="68" font-family="'Inter', sans-serif" font-size="11" fill="#0A9685">Documento seguro</text>

      <!-- Download Button -->
      <rect x="15" y="75" width="190" height="26" rx="4" fill="#EA5F39" />
      <text x="110" y="92" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">⬇ Descargar Documento</text>
    </g>

    <!-- Download Notification Banner -->
    <g transform="translate(30, 235)">
      <rect x="0" y="0" width="220" height="70" rx="8" fill="#F0F9F8" stroke="#0A9685" stroke-width="1.5" />
      <circle cx="25" cy="35" r="14" fill="#0A9685" />
      <text x="25" y="40" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF">✓</text>
      <text x="48" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#076C60">Descarga completada</text>
      <text x="48" y="45" font-family="'Inter', sans-serif" font-size="10" fill="#5F5E5A">Factura_Agua_Oct.pdf</text>
      <text x="48" y="58" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#0A9685">Tocar para abrir</text>
    </g>

    <!-- Bottom Instruction -->
    <g transform="translate(30, 325)">
      <rect x="0" y="0" width="220" height="50" rx="6" fill="#FEF9F1" />
      <text x="10" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#E79410">💡 Explicación de Yeimi:</text>
      <text x="10" y="38" font-family="'Inter', sans-serif" font-size="10" fill="#5F5E5A">La flecha ⬇ hacia abajo siempre significa descargar.</text>
    </g>

    <rect x="90" y="405" width="100" height="5" rx="2.5" fill="#C7C7C7" />
  </g>

  <!-- Right Side: Step by Step Guide -->
  <g transform="translate(390, 115)">
    <text x="0" y="25" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#282828">El proceso de descarga en 3 pasos</text>
    <text x="0" y="50" font-family="'Inter', sans-serif" font-size="14" fill="#5F5E5A">Instrucciones claras y directas sin tecnicismos</text>

    <!-- Step 1 -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="330" height="70" rx="8" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1" />
      <circle cx="35" cy="35" r="16" fill="#EA5F39" />
      <text x="35" y="41" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
      <text x="68" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#282828">Identificar el botón</text>
      <text x="68" y="48" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">Buscar el botón con la palabra "Descargar" o el ícono ⬇.</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="330" height="70" rx="8" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1" />
      <circle cx="35" cy="35" r="16" fill="#EA5F39" />
      <text x="35" y="41" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
      <text x="68" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#282828">Aceptar la descarga</text>
      <text x="68" y="48" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">Si el celular pregunta: "¿Desea descargar?", pulsar "Sí".</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(0, 245)">
      <rect x="0" y="0" width="330" height="70" rx="8" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1" />
      <circle cx="35" cy="35" r="16" fill="#0A9685" />
      <text x="35" y="41" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
      <text x="68" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#076C60">Comprobar la notificación</text>
      <text x="68" y="48" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">Aparece un chulito ✔ arriba indicando que ya está listo.</text>
    </g>

    <!-- Bottom summary box -->
    <rect x="0" y="335" width="330" height="65" rx="8" fill="#FEF5F3" stroke="#EA5F39" stroke-width="1" />
    <text x="18" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#EA5F39">¿Qué formato buscar?</text>
    <text x="18" y="48" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">Los documentos oficiales como facturas y recetas vienen en formato <tspan font-weight="700">.PDF</tspan>.</text>
  </g>
</svg>
