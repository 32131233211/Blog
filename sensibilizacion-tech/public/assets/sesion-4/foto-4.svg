<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F7F6F4; }
      .card-bg { fill: #FFFFFF; stroke: #C7C7C7; stroke-width: 2; rx: 16; }
      .phone-frame { fill: #FFFFFF; stroke: #C95231; stroke-width: 3; rx: 28; }
    </style>
  </defs>

  <rect width="800" height="600" class="bg" />
  <rect x="40" y="30" width="720" height="540" class="card-bg" />

  <!-- Header Bar -->
  <path d="M 40 46 Q 40 30 56 30 L 744 30 Q 760 30 760 46 L 760 90 L 40 90 Z" fill="#EA5F39" />
  <circle cx="75" cy="60" r="14" fill="#FFFFFF" opacity="0.2" />
  <text x="75" y="66" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#FFFFFF">📂</text>
  <text x="105" y="67" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Almacenamiento Local · Dónde se Guardan los Archivos Descargados</text>

  <!-- Left: File Manager Screen on Phone -->
  <g transform="translate(80, 115)">
    <rect x="0" y="0" width="280" height="425" class="phone-frame" />
    <rect x="95" y="12" width="90" height="10" rx="5" fill="#C7C7C7" />

    <!-- App Header -->
    <rect x="15" y="35" width="250" height="40" rx="6" fill="#F7F6F4" />
    <text x="30" y="60" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#282828">Mis Archivos</text>
    <text x="180" y="60" font-family="'Inter', sans-serif" font-size="11" fill="#EA5F39">Memoria interna</text>

    <!-- File Path Bar -->
    <g transform="translate(25, 85)">
      <rect x="0" y="0" width="230" height="28" rx="4" fill="#FEF5F3" />
      <text x="10" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#EA5F39">Inicio &gt; Descargas (Download)</text>
    </g>

    <!-- Downloaded Items List -->
    <g transform="translate(25, 125)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="230" height="52" rx="6" fill="#F0F9F8" stroke="#0A9685" stroke-width="1.5" />
      <rect x="10" y="8" width="30" height="36" rx="4" fill="#EA5F39" />
      <text x="25" y="30" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">PDF</text>
      <text x="50" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#282828">Factura_Agua_Oct.pdf</text>
      <text x="50" y="39" font-family="'Inter', sans-serif" font-size="10" fill="#5F5E5A">Hoy, 10:15 AM · 245 KB</text>

      <!-- Item 2 -->
      <rect x="0" y="60" width="230" height="52" rx="6" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1" />
      <rect x="10" y="68" width="30" height="36" rx="4" fill="#EA5F39" />
      <text x="25" y="90" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">PDF</text>
      <text x="50" y="84" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#282828">Cita_Medica_General.pdf</text>
      <text x="50" y="99" font-family="'Inter', sans-serif" font-size="10" fill="#5F5E5A">Ayer · 180 KB</text>

      <!-- Item 3 -->
      <rect x="0" y="120" width="230" height="52" rx="6" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1" />
      <rect x="10" y="128" width="30" height="36" rx="4" fill="#0A9685" />
      <text x="25" y="150" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">IMG</text>
      <text x="50" y="144" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#282828">Receta_Medica_Foto.jpg</text>
      <text x="50" y="159" font-family="'Inter', sans-serif" font-size="10" fill="#5F5E5A">24 Sep · 1.2 MB</text>
    </g>

    <!-- Search in Files Helper -->
    <g transform="translate(25, 315)">
      <rect x="0" y="0" width="230" height="55" rx="6" fill="#F7F6F4" />
      <text x="12" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#282828">¿No encuentra su archivo?</text>
      <text x="12" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#5F5E5A">Toque la lupita 🔍 arriba y escriba "Factura".</text>
    </g>

    <rect x="90" y="405" width="100" height="5" rx="2.5" fill="#C7C7C7" />
  </g>

  <!-- Right: Storage Explanation -->
  <g transform="translate(390, 115)">
    <text x="0" y="25" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#282828">¿A dónde fue mi documento?</text>
    <text x="0" y="50" font-family="'Inter', sans-serif" font-size="14" fill="#5F5E5A">La pregunta más común de los participantes resuelta por Yeimi</text>

    <!-- Box 1 -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="330" height="85" rx="8" fill="#F0F9F8" stroke="#0A9685" stroke-width="1.5" />
      <text x="20" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#076C60">1. La app "Mis Archivos" o "Archivos"</text>
      <text x="20" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#282828">Es como el archivador físico de su casa, pero digital. Todos los celulares la tienen con ícono de carpeta amarilla o azul.</text>
    </g>

    <!-- Box 2 -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="330" height="85" rx="8" fill="#FEF5F3" stroke="#EA5F39" stroke-width="1.5" />
      <text x="20" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#A84429">2. La carpeta "Descargas" o "Download"</text>
      <text x="20" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#282828">Aquí van automáticamente todos los archivos que usted baja de internet, de páginas web o de correos.</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="330" height="85" rx="8" fill="#FEF9F1" stroke="#E79410" stroke-width="1" />
      <text x="20" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#A66B0C">3. Verificación de almacenamiento</text>
      <text x="20" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#282828">Aprender a revisar el espacio disponible para que el teléfono no se vuelva lento ni se quede sin memoria.</text>
    </g>
  </g>
</svg>
