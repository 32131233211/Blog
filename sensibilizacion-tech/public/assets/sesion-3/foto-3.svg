<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F7F6F4; }
      .card-bg { fill: #FFFFFF; stroke: #C7C7C7; stroke-width: 2; rx: 16; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-size: 22px; font-weight: 700; fill: #282828; }
    </style>
  </defs>

  <rect width="800" height="600" class="bg" />
  <rect x="40" y="30" width="720" height="540" class="card-bg" />

  <!-- Header Bar -->
  <path d="M 40 46 Q 40 30 56 30 L 744 30 Q 760 30 760 46 L 760 90 L 40 90 Z" fill="#0A9685" />
  <circle cx="75" cy="60" r="14" fill="#FFFFFF" opacity="0.2" />
  <text x="75" y="66" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#FFFFFF">🔑</text>
  <text x="105" y="67" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Manejo Seguro de Contraseñas · Técnica de Frases Clave</text>

  <!-- Comparison Columns: Weak vs Strong -->
  <g transform="translate(60, 115)">
    <!-- Column 1: Weak Password -->
    <rect x="0" y="0" width="320" height="340" rx="12" fill="#FEF5F3" stroke="#EA5F39" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 308 0 Q 320 0 320 12 L 320 50 L 0 50 Z" fill="#EA5F39" />
    <text x="160" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">❌ Contraseñas Inseguras (Peligro)</text>

    <!-- Weak examples -->
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="280" height="45" rx="6" fill="#FFFFFF" stroke="#EA5F39" stroke-width="1" />
      <text x="15" y="28" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#EA5F39">123456</text>
      <text x="180" y="27" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">Muy fácil</text>

      <rect x="0" y="60" width="280" height="45" rx="6" fill="#FFFFFF" stroke="#EA5F39" stroke-width="1" />
      <text x="15" y="88" font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#EA5F39">carlos1958</text>
      <text x="165" y="87" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">Nombre + año</text>

      <rect x="0" y="120" width="280" height="45" rx="6" fill="#FFFFFF" stroke="#EA5F39" stroke-width="1" />
      <text x="15" y="148" font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#EA5F39">medellin2020</text>
      <text x="165" y="147" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">Fácil de adivinar</text>

      <!-- Explanatory note -->
      <text x="0" y="200" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#EA5F39">¿Por qué son peligrosas?</text>
      <text x="0" y="222" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">• Los estafadores prueban fechas de cumpleaños.</text>
      <text x="0" y="240" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">• Son vulnerables a ataques automatizados.</text>
      <text x="0" y="258" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">• Si descifran una, entran a todas sus cuentas.</text>
    </g>

    <!-- Column 2: Strong Password -->
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="320" height="340" rx="12" fill="#F0F9F8" stroke="#0A9685" stroke-width="1.5" />
      <path d="M 0 12 Q 0 0 12 0 L 308 0 Q 320 0 320 12 L 320 50 L 0 50 Z" fill="#0A9685" />
      <text x="160" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">✔ Contraseña Fuerte (Recomendada)</text>

      <g transform="translate(20, 70)">
        <rect x="0" y="0" width="280" height="45" rx="6" fill="#FFFFFF" stroke="#0A9685" stroke-width="1.5" />
        <text x="12" y="28" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#076C60">MiCafe#Caliente.24</text>

        <!-- Strength bar -->
        <rect x="0" y="58" width="280" height="8" rx="4" fill="#E0E0E0" />
        <rect x="0" y="58" width="280" height="8" rx="4" fill="#0A9685" />
        <text x="0" y="80" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#076C60">Seguridad: EXCELENTE</text>

        <!-- Method explanation -->
        <rect x="0" y="95" width="280" height="160" rx="8" fill="#FFFFFF" stroke="#80C8C0" stroke-width="1" />
        <text x="15" y="120" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#076C60">Técnica enseñada a los padres:</text>
        <text x="15" y="142" font-family="'Inter', sans-serif" font-size="12" fill="#282828">1. Piense una frase: "Mi café caliente"</text>
        <text x="15" y="162" font-family="'Inter', sans-serif" font-size="12" fill="#282828">2. Ponga mayúsculas: "MiCafeCaliente"</text>
        <text x="15" y="182" font-family="'Inter', sans-serif" font-size="12" fill="#282828">3. Añada un símbolo y número: "#" y "24"</text>
        <text x="15" y="202" font-family="'Inter', sans-serif" font-size="12" fill="#282828">4. Fácil de recordar, imposible de adivinar.</text>
        <text x="15" y="235" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#5F5E5A">✔ Anótela en un cuaderno seguro en casa.</text>
      </g>
    </g>
  </g>

  <!-- Footer Tip -->
  <g transform="translate(60, 475)">
    <rect x="0" y="0" width="680" height="65" rx="8" fill="#FEF9F1" stroke="#E79410" stroke-width="1.5" />
    <circle cx="35" cy="32" r="16" fill="#E79410" />
    <text x="35" y="38" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF">💡</text>
    <text x="65" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#A66B0C">Consejo de oro para el adulto mayor:</text>
    <text x="65" y="47" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">Nunca comparta su clave por teléfono ni por WhatsApp, ni siquiera si le dicen que llaman del banco.</text>
  </g>
</svg>
