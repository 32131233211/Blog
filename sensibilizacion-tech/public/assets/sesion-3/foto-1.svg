<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F7F6F4; }
      .card-bg { fill: #FFFFFF; stroke: #C7C7C7; stroke-width: 2; rx: 16; }
      .header-teal { fill: #0A9685; }
      .alert-red { fill: #EA5F39; }
      .alert-bg { fill: #FEF5F3; stroke: #EA5F39; stroke-width: 1.5; rx: 8; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-size: 26px; font-weight: 700; fill: #282828; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 500; fill: #5F5E5A; }
      .msg-bubble { fill: #F0F9F8; stroke: #80C8C0; stroke-width: 1.5; rx: 12; }
      .phone-frame { fill: #FFFFFF; stroke: #076C60; stroke-width: 3; rx: 28; }
      .text-body { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; fill: #282828; }
      .badge-text { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      .warn-text { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #EA5F39; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" class="bg" />

  <!-- Main Card -->
  <rect x="40" y="30" width="720" height="540" class="card-bg" />

  <!-- Header Bar -->
  <path d="M 40 46 Q 40 30 56 30 L 744 30 Q 760 30 760 46 L 760 90 L 40 90 Z" fill="#0A9685" />
  <circle cx="75" cy="60" r="14" fill="#FFFFFF" opacity="0.2" />
  <text x="75" y="66" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#FFFFFF">💬</text>
  <text x="105" y="67" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Seguridad en Mensajería SMS · Alerta de Fraude (Smishing)</text>

  <!-- Phone Mockup on Left -->
  <g transform="translate(80, 120)">
    <!-- Phone body -->
    <rect x="0" y="0" width="280" height="420" class="phone-frame" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))" />
    <!-- Notch/Speaker -->
    <rect x="95" y="12" width="90" height="10" rx="5" fill="#C7C7C7" />
    <circle cx="195" cy="17" r="4" fill="#C7C7C7" />

    <!-- Phone screen header -->
    <rect x="15" y="35" width="250" height="45" rx="8" fill="#F7F6F4" />
    <circle cx="38" cy="58" r="14" fill="#EA5F39" />
    <text x="38" y="63" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">!</text>
    <text x="60" y="54" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#282828">+57 300 000 0000</text>
    <text x="60" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#EA5F39">Número desconocido</text>

    <!-- Fake SMS message bubble -->
    <rect x="15" y="95" width="250" height="160" class="msg-bubble" />
    <text x="25" y="120" class="text-body" font-weight="700" fill="#EA5F39">⚠️ BANCO ALERTA:</text>
    <text x="25" y="145" class="text-body">Su cuenta ha sido bloqueada</text>
    <text x="25" y="168" class="text-body">por intentos fallidos.</text>
    <text x="25" y="195" class="text-body">Ingrese de inmediato aquí:</text>
    <text x="25" y="222" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#0A9685" text-decoration="underline">http://banco-bloqueo.info/xyz</text>
    <text x="25" y="243" font-family="'Inter', sans-serif" font-size="11" fill="#5F5E5A">10:42 AM · Vía SMS</text>

    <!-- Danger Badge -->
    <rect x="25" y="270" width="230" height="60" rx="8" fill="#FEF5F3" stroke="#EA5F39" stroke-width="1.5" />
    <text x="40" y="295" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#EA5F39">❌ PELIGRO: Enlace trampa</text>
    <text x="40" y="315" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">Los bancos nunca piden claves por SMS.</text>

    <!-- Phone Home Bar -->
    <rect x="90" y="402" width="100" height="5" rx="2.5" fill="#C7C7C7" />
  </g>

  <!-- Pedagogical Explanation on Right -->
  <g transform="translate(390, 120)">
    <text x="0" y="25" class="title">¿Cómo reconocer un SMS falso?</text>
    <text x="0" y="55" class="subtitle">Guía visual para los adultos mayores de Sabios Digitales</text>

    <!-- Tip 1 -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="330" height="65" rx="8" fill="#F0F9F8" stroke="#80C8C0" stroke-width="1" />
      <circle cx="28" cy="32" r="16" fill="#0A9685" />
      <text x="28" y="38" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
      <text x="55" y="25" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#076C60">Sentido de urgencia</text>
      <text x="55" y="46" font-family="'Inter', sans-serif" font-size="13" fill="#5F5E5A">Dicen: "¡Urgente!", "¡Bloqueo en 5 min!".</text>
    </g>

    <!-- Tip 2 -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="330" height="65" rx="8" fill="#FEF5F3" stroke="#EA5F39" stroke-width="1" />
      <circle cx="28" cy="32" r="16" fill="#EA5F39" />
      <text x="28" y="38" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
      <text x="55" y="25" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#A84429">Enlaces extraños o raros</text>
      <text x="55" y="46" font-family="'Inter', sans-serif" font-size="13" fill="#5F5E5A">Direcciones web recortadas o con errores.</text>
    </g>

    <!-- Tip 3 -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="330" height="65" rx="8" fill="#FEF9F1" stroke="#E79410" stroke-width="1" />
      <circle cx="28" cy="32" r="16" fill="#E79410" />
      <text x="28" y="38" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
      <text x="55" y="25" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#A66B0C">Regla de oro: No tocar</text>
      <text x="55" y="46" font-family="'Inter', sans-serif" font-size="13" fill="#5F5E5A">No toque el link. Consulte con un familiar.</text>
    </g>

    <!-- Bottom note -->
    <rect x="0" y="325" width="330" height="45" rx="6" fill="#0A9685" />
    <text x="165" y="353" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Capacitación 3 · Facilitador: Sebastián</text>
  </g>
</svg>
