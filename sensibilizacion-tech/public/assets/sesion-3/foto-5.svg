<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F7F6F4; }
      .card-bg { fill: #FFFFFF; stroke: #C7C7C7; stroke-width: 2; rx: 16; }
      .phone-frame { fill: #FFFFFF; stroke: #076C60; stroke-width: 3; rx: 28; }
    </style>
  </defs>

  <rect width="800" height="600" class="bg" />
  <rect x="40" y="30" width="720" height="540" class="card-bg" />

  <!-- Header Bar -->
  <path d="M 40 46 Q 40 30 56 30 L 744 30 Q 760 30 760 46 L 760 90 L 40 90 Z" fill="#0A9685" />
  <circle cx="75" cy="60" r="14" fill="#FFFFFF" opacity="0.2" />
  <text x="75" y="66" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#FFFFFF">📲</text>
  <text x="105" y="67" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Descarga Segura de Aplicaciones · Tiendas Oficiales</text>

  <!-- Left: Google Play / App Store Mockup -->
  <g transform="translate(80, 115)">
    <rect x="0" y="0" width="280" height="425" class="phone-frame" />
    <rect x="95" y="12" width="90" height="10" rx="5" fill="#C7C7C7" />

    <!-- Play Store header simulation -->
    <rect x="15" y="35" width="250" height="40" rx="6" fill="#F7F6F4" />
    <text x="30" y="60" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0A9685">Google Play</text>
    <text x="150" y="60" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">🔍 Buscar apps</text>

    <!-- App Item Card -->
    <g transform="translate(25, 90)">
      <!-- App Icon -->
      <rect x="0" y="0" width="55" height="55" rx="12" fill="#0A9685" />
      <text x="27" y="36" text-anchor="middle" font-family="'Inter', sans-serif" font-size="24" fill="#FFFFFF">✓</text>
      
      <text x="68" y="22" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#282828">App Oficial</text>
      <text x="68" y="38" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#0A9685">✔ Desarrollador verificado</text>
      <text x="68" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#5F5E5A">⭐ 4.8 · +10 M descargas</text>

      <!-- Install Button -->
      <rect x="0" y="70" width="230" height="38" rx="6" fill="#0A9685" />
      <text x="115" y="94" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Instalar Seguro</text>
    </g>

    <!-- Play Protect Badge -->
    <g transform="translate(25, 215)">
      <rect x="0" y="0" width="230" height="65" rx="8" fill="#F0F9F8" stroke="#0A9685" stroke-width="1.5" />
      <circle cx="25" cy="32" r="14" fill="#0A9685" />
      <text x="25" y="37" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF">🛡️</text>
      <text x="48" y="25" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#076C60">Google Play Protect activo</text>
      <text x="48" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#5F5E5A">Esta app fue analizada y está libre de virus.</text>
    </g>

    <!-- Warning on External Files -->
    <g transform="translate(25, 295)">
      <rect x="0" y="0" width="230" height="85" rx="8" fill="#FEF5F3" stroke="#EA5F39" stroke-width="1.5" />
      <text x="12" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#EA5F39">❌ NUNCA instalar archivos APK:</text>
      <text x="12" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#282828">Si alguien le envía un archivo que termine en ".apk" por WhatsApp o internet, ¡no lo abra!</text>
      <text x="12" y="72" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#EA5F39">Son virus que espían su celular.</text>
    </g>

    <rect x="90" y="405" width="100" height="5" rx="2.5" fill="#C7C7C7" />
  </g>

  <!-- Right: 4 Rules for Safe Downloads -->
  <g transform="translate(390, 115)">
    <text x="0" y="25" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#282828">Reglas para descargar sin riesgos</text>
    <text x="0" y="50" font-family="'Inter', sans-serif" font-size="14" fill="#5F5E5A">Hábitos enseñados durante la sesión de Sebastián</text>

    <!-- Rule 1 -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="330" height="60" rx="8" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1" />
      <text x="15" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0A9685">1. Usar solo la tienda oficial</text>
      <text x="15" y="46" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">Google Play Store en Android o App Store en iPhone.</text>
    </g>

    <!-- Rule 2 -->
    <g transform="translate(0, 145)">
      <rect x="0" y="0" width="330" height="60" rx="8" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1" />
      <text x="15" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0A9685">2. Mirar la cantidad de descargas</text>
      <text x="15" y="46" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">Una app bancaria real tiene millones de usuarios.</text>
    </g>

    <!-- Rule 3 -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="330" height="60" rx="8" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1" />
      <text x="15" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0A9685">3. Leer opiniones y estrellas</text>
      <text x="15" y="46" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">Verificar comentarios de otros usuarios antes de tocar.</text>
    </g>

    <!-- Rule 4 -->
    <g transform="translate(0, 285)">
      <rect x="0" y="0" width="330" height="60" rx="8" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1" />
      <text x="15" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#EA5F39">4. Cuidado con los permisos</text>
      <text x="15" y="46" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">Si una app de linterna pide ver sus contactos, desconfíe.</text>
    </g>

    <!-- Bottom summary -->
    <rect x="0" y="360" width="330" height="42" rx="6" fill="#F0F9F8" stroke="#80C8C0" stroke-width="1" />
    <text x="165" y="386" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#076C60">Práctica guiada en vivo sobre los dispositivos</text>
  </g>
</svg>
