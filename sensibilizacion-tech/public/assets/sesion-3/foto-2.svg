<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F7F6F4; }
      .card-bg { fill: #FFFFFF; stroke: #C7C7C7; stroke-width: 2; rx: 16; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-size: 24px; font-weight: 700; fill: #282828; }
      .text-body { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: #282828; }
      .text-muted { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #5F5E5A; }
    </style>
  </defs>

  <rect width="800" height="600" class="bg" />
  <rect x="40" y="30" width="720" height="540" class="card-bg" />

  <!-- Header Bar -->
  <path d="M 40 46 Q 40 30 56 30 L 744 30 Q 760 30 760 46 L 760 90 L 40 90 Z" fill="#0A9685" />
  <circle cx="75" cy="60" r="14" fill="#FFFFFF" opacity="0.2" />
  <text x="75" y="66" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#FFFFFF">✉️</text>
  <text x="105" y="67" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Seguridad en el Correo Electrónico · Detección de Phishing</text>

  <!-- Email Client Window Simulation -->
  <g transform="translate(70, 115)">
    <!-- Email Box Frame -->
    <rect x="0" y="0" width="660" height="425" rx="10" fill="#FFFFFF" stroke="#C7C7C7" stroke-width="1.5" />
    
    <!-- Email Toolbar -->
    <rect x="0" y="0" width="660" height="45" rx="10" fill="#F7F6F4" />
    <circle cx="25" cy="22" r="6" fill="#EA5F39" />
    <circle cx="45" cy="22" r="6" fill="#E79410" />
    <circle cx="65" cy="22" r="6" fill="#0A9685" />
    <text x="95" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#5F5E5A">Bandeja de entrada — Correo sospechoso analizado en clase</text>

    <!-- Email Header Details -->
    <g transform="translate(25, 65)">
      <!-- Subject -->
      <text x="0" y="20" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#282828">URGENTE: Verificación de seguridad de su cuenta bancaria</text>
      
      <!-- Sender & Warning Callout -->
      <rect x="0" y="35" width="610" height="60" rx="8" fill="#FEF5F3" stroke="#EA5F39" stroke-width="1" />
      <text x="15" y="60" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#EA5F39">Remitente falso:</text>
      <text x="145" y="60" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#282828">Soporte Banco &lt;notificaciones@banc0-colombia-seguro.xyz&gt;</text>
      <text x="15" y="82" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">⚠️ Alerta explicada por Sebastián: Fíjese que el dominio termina en ".xyz" y tiene un cero "0" en el nombre.</text>

      <!-- Date -->
      <text x="500" y="20" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">14:20 · Sesión 3</text>
    </g>

    <!-- Email Body Content -->
    <g transform="translate(25, 180)">
      <line x1="0" y1="0" x2="610" y2="0" stroke="#C7C7C7" stroke-dasharray="4" />
      <text x="0" y="30" class="text-body">Estimado(a) usuario(a),</text>
      <text x="0" y="55" class="text-body">Hemos detectado accesos no autorizados a sus productos financieros.</text>
      <text x="0" y="75" class="text-body">Para evitar el bloqueo permanente de sus tarjetas, debe ingresar a nuestro portal en menos de 2 horas:</text>
      
      <!-- Fake Phishing Button -->
      <rect x="0" y="95" width="230" height="42" rx="6" fill="#EA5F39" />
      <text x="115" y="121" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">ACTUALIZAR DATOS AQUÍ</text>

      <!-- Educational Pointer Box -->
      <rect x="250" y="92" width="360" height="48" rx="6" fill="#F0F9F8" stroke="#0A9685" stroke-width="1.5" />
      <text x="265" y="112" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#076C60">Pauta práctica de seguridad:</text>
      <text x="265" y="130" font-family="'Inter', sans-serif" font-size="12" fill="#282828">Nunca haga clic en botones de alerta. Llame a la línea oficial.</text>
    </g>

    <!-- Checklist at Bottom -->
    <g transform="translate(25, 345)">
      <rect x="0" y="0" width="610" height="65" rx="8" fill="#F7F6F4" />
      <text x="20" y="25" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0A9685">Puntos clave explicados a los adultos mayores:</text>
      <text x="20" y="48" font-family="'Inter', sans-serif" font-size="12" fill="#5F5E5A">✔ Verificar el correo real · ✔ No asustarse ante amenazas de bloqueo · ✔ Confirmar siempre con el equipo</text>
    </g>
  </g>
</svg>
